
# aipc.yaml: AI Product Configuration
project:
  name: Flood detection
  version: 1.2.0
  description: >
    This project focuses on flood detection and analysis using satellite imagery 
    (Sentinel-1 and Sentinel-2). It calculates NDWI and visualizes flood-prone areas, 
    storing results as raster and vector data for further geospatial analysis.
  author: Munazza@FBK
  license: MIT
  repository: https://github.com/Munazaa/Flood-Mapping-Case.git
dependencies:
  python:
    - rasterio
    - geopandas
    - numpy
    - matplotlib 
    - pandas
    - glob2
    - tqdm
    - shapely
    - pillow
    - contextily
 
 datasets:
      - COPERNICUS/S1_GRD
      - COPERNICUS/S2_SR

workflow:
  - Step 1: Load Sentinel-1 and Sentinel-2 data for the defined AOI
  - Step 2: Preprocess data (cloud masking, smoothing, slope filtering)
  - Step 3: Process Sentinel-1 data to compute backscatter for water detection
  - Step 4: Compute NDWI from Sentinel-2
  - Step 7: Calculate flood extent layer by fusing all flood layers
  - Step 8: Export results (e.g., as shapefiles and rastor)

outputs:
  vector: path\to\outputfolder (Shapefiles for flood-affected areas)
  raster: path\to\outputfolder (.tif file for flood-affected areas)
  metadata: .json file for meta data

notes:
  - Post-processing is ongoing to improve flood detection accuracy.
  - Results are compatible with geospatial tools like QGIS and ArcGIS.
