[GENERAL]
flood_date = YYYY-MM-DD

# Sentinel-1 will be downloaded from ±7 days around this date
# Sentinel-2 will be downloaded from ±20 days around this date

[INPUT]
# User-defined AOI polygon (WKT format, must be a rectangle for best results)
aoi_wkt = POLYGON ((10.64 45.85, 10.64 46.06, 10.99 46.06, 10.99 45.85, 10.64 45.85)) 

# Satellite data collections
s1_collection = COPERNICUS/S1_GRD
s2_collection = COPERNICUS/S2_SR

# Auxiliary layers
slope_path = slope_TN/slope.tif
lakes_dataset = Lakes_TN/lakes.shp
rivers_dataset = Rivers_TN/rivers.shp

# Processing parameters
target_crs = EPSG:25832
polarization = VV,VH
dem_threshold = 600
slope_threshold = 9
noise_min_pixels = 7
river_buffer_meters = 1

[OUTPUT]
output_directory = ./flood_outputs
